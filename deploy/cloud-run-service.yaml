apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: url-shortener
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: ai-assisted-url-shortener:us-central1:url-shortener-postgres
        run.googleapis.com/vpc-access-connector: projects/ai-assisted-url-shortener/locations/us-central1/connectors/url-shortener-vpc
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: url-shortener-runtime@ai-assisted-url-shortener.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/ai-assisted-url-shortener/url-shortener/url-shortener:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_BASE_URL
              value: https://YOUR_CLOUD_RUN_URL
            - name: APP_SHORT_CODE_LENGTH
              value: "7"
            - name: APP_SHORT_CODE_MAX_ATTEMPTS
              value: "10"
            - name: APP_CACHE_TTL
              value: 24h
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql:///urlshortener?cloudSqlInstance=ai-assisted-url-shortener:us-central1:url-shortener-postgres&socketFactory=com.google.cloud.sql.postgres.SocketFactory
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: url-shortener-db-username
                  key: latest
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: url-shortener-db-password
                  key: latest
            - name: SPRING_DATA_REDIS_HOST
              value: REDIS_PRIVATE_IP
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
