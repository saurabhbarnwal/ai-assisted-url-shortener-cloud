name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ai-assisted-url-shortener
  REGION: us-central1
  SERVICE_NAME: url-shortener
  ARTIFACT_REPOSITORY: url-shortener
  IMAGE_NAME: url-shortener

jobs:
  test-build-deploy:
    name: Test, Build, and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run tests
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            gradle:8.10.2-jdk21-alpine \
            gradle clean test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - id: build
        name: Build Docker image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "Building ${IMAGE_URI}"
          docker build --tag "${IMAGE_URI}" .
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Push Docker image
        run: |
          docker push "${{ steps.build.outputs.image_uri }}"

      - id: deploy
        name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.build.outputs.image_uri }}
          flags: >-
            --platform=managed
            --allow-unauthenticated
          env_vars: |-
            APP_SHORT_CODE_LENGTH=7
            APP_SHORT_CODE_MAX_ATTEMPTS=10
            APP_CACHE_TTL=24h

      - name: Show service URL
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
