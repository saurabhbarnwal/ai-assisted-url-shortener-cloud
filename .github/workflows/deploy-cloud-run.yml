name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ai-assisted-url-shortener
  REGION: us-central1
  SERVICE_NAME: url-shortener
  ARTIFACT_REPOSITORY: url-shortener
  IMAGE_NAME: url-shortener

jobs:
  test-build-deploy:
    name: Test, Build, and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            gradle:8.10.2-jdk21-alpine \
            gradle clean test

      - name: Validate Workload Identity Provider format
        run: |
          case "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" in
            projects/*/locations/global/workloadIdentityPools/*/providers/*)
              echo "Workload Identity Provider format is valid."
              ;;
            *)
              echo "GCP_WORKLOAD_IDENTITY_PROVIDER must look like projects/204743655262/locations/global/workloadIdentityPools/github/providers/github-main"
              echo "Do not prefix it with //iam.googleapis.com/."
              exit 1
              ;;
          esac

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Validate Cloud Run runtime variables
        run: |
          if ! [[ "${{ vars.APP_BASE_URL }}" =~ ^https?:// ]]; then
            echo "APP_BASE_URL must be a real URL, for example https://your-cloud-run-url.a.run.app"
            exit 1
          fi
          if [[ "${{ vars.REDIS_HOST }}" == *" "* ]] || [[ -z "${{ vars.REDIS_HOST }}" ]]; then
            echo "REDIS_HOST must be the Memorystore Redis private IP or DNS name, not placeholder text."
            exit 1
          fi

      - id: build
        name: Build Docker image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "Building ${IMAGE_URI}"
          docker build --tag "${IMAGE_URI}" .
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Push Docker image
        run: |
          docker push "${{ steps.build.outputs.image_uri }}"

      - id: deploy
        name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.build.outputs.image_uri }}
          flags: >-
            --platform=managed
            --allow-unauthenticated
            --service-account=url-shortener-runtime@ai-assisted-url-shortener.iam.gserviceaccount.com
            --add-cloudsql-instances=ai-assisted-url-shortener:us-central1:url-shortener-postgres
            --vpc-connector=url-shortener-vpc
            --vpc-egress=private-ranges-only
          env_vars: |-
            APP_BASE_URL=${{ vars.APP_BASE_URL }}
            APP_SHORT_CODE_LENGTH=7
            APP_SHORT_CODE_MAX_ATTEMPTS=10
            APP_CACHE_TTL=24h
            SERVER_PORT=8080
            SPRING_DATASOURCE_URL=jdbc:postgresql:///urlshortener?cloudSqlInstance=ai-assisted-url-shortener:us-central1:url-shortener-postgres&socketFactory=com.google.cloud.sql.postgres.SocketFactory
            SPRING_DATA_REDIS_HOST=${{ vars.REDIS_HOST }}
            SPRING_DATA_REDIS_PORT=6379
          secrets: |-
            SPRING_DATASOURCE_USERNAME=url-shortener-db-username:latest
            SPRING_DATASOURCE_PASSWORD=url-shortener-db-password:latest

      - name: Show service URL
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"

      - name: Show Cloud Run logs on failure
        if: failure()
        run: |
          gcloud run services logs read "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --limit=200
